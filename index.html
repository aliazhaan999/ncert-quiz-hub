<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --primary:#4f46e5;
  --secondary:#7c3aed;
  --green:#16a34a;
  --red:#dc2626;
  --border:#e5e7eb;
  --shadow:0 12px 35px rgba(15,23,42,.10);
}
body{
  margin:0;
  font-family:Arial,Segoe UI,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select{font:inherit}
button{cursor:pointer}
header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.nav{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.logo{
  font-weight:900;
  font-size:21px;
  color:var(--primary);
}
.navBtns{display:flex;gap:8px;flex-wrap:wrap}
.container{
  max-width:1200px;
  margin:auto;
  padding:25px 18px;
}
.hero{
  color:white;
  padding:35px;
  border-radius:25px;
  background:linear-gradient(135deg,#312e81,#7c3aed);
  box-shadow:var(--shadow);
  margin-bottom:22px;
}
.hero h1{
  font-size:clamp(30px,5vw,52px);
  margin:10px 0;
}
.hero p{font-size:17px;opacity:.92}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}
.card,.tile{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
}
.tile{
  width:100%;
  text-align:left;
  color:var(--text);
  transition:.2s;
}
.tile:hover{
  transform:translateY(-4px);
  border-color:#818cf8;
}
.emoji{font-size:30px}
.muted{color:var(--muted)}
.stat{
  font-size:30px;
  font-weight:900;
}
.btn{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  background:#eef2ff;
  color:#3730a3;
  font-weight:800;
}
.primary{
  color:white;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
}
.danger{
  background:#fee2e2;
  color:#991b1b;
}
.row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.between{justify-content:space-between}
.pill{
  display:inline-block;
  padding:5px 10px;
  border-radius:50px;
  background:#eef2ff;
  color:#3730a3;
  font-size:12px;
  font-weight:900;
}
.search{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:13px;
  outline:none;
  margin:5px 0 18px;
  background:white;
}
.quiz{
  max-width:850px;
  margin:auto;
}
.question{
  font-size:27px;
  line-height:1.35;
}
.option{
  display:block;
  width:100%;
  padding:15px;
  margin:10px 0;
  border:2px solid var(--border);
  border-radius:14px;
  background:white;
  text-align:left;
}
.option:hover{border-color:#818cf8}
.option.correct{
  background:#dcfce7;
  border-color:var(--green);
}
.option.wrong{
  background:#fee2e2;
  border-color:var(--red);
}
.feedback{
  margin-top:15px;
  padding:15px;
  border-radius:14px;
  font-weight:800;
}
.good{
  background:#dcfce7;
  color:#166534;
}
.bad{
  background:#fee2e2;
  color:#991b1b;
}
.progress{
  height:10px;
  background:#e5e7eb;
  border-radius:50px;
  overflow:hidden;
}
.progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
}
.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:linear-gradient(135deg,#111827,#4c1d95);
}
.authBox{
  width:min(460px,100%);
  background:white;
  padding:30px;
  border-radius:25px;
  box-shadow:var(--shadow);
}
.authBox input{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:12px;
  margin:7px 0;
}
.owner{
  margin-top:18px;
  padding:18px;
  border:2px dashed #a5b4fc;
  border-radius:15px;
  background:#eef2ff;
}
footer{
  text-align:center;
  padding:40px 18px;
  color:var(--muted);
}
.dark{
  --bg:#0b1220;
  --card:#131d30;
  --text:#f8fafc;
  --muted:#a9b4c7;
  --border:#334155;
}
.dark header{background:rgba(11,18,32,.94)}
.dark .tile,
.dark .card,
.dark .option,
.dark .search,
.dark .authBox{
  background:#131d30;
  color:#f8fafc;
}
@media(max-width:650px){
  .nav{
    flex-direction:column;
    align-items:flex-start;
  }
  .hero{padding:25px}
  .question{font-size:22px}
}
</style>
</head>

function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {
      "&":"&amp;","<":"&lt;",">":"&gt;",

function signup(){
  const n=document.getElementById("username").value.trim();
  const p=document.getElementById("password").value;

  if(!n||!p){
    document.getElementById("msg").textContent="Enter a name and password.";
    return;
  }

  if(localStorage.getItem("user_"+n)){
    document.getElementById("msg").textContent="This username already exists.";
    return;
  }

  localStorage.setItem("user_"+n,JSON.stringify({password:p}));
  user=n;
  save();
  dashboard();
}

function login(){
  const n=document.getElementById("username").value.trim();
  const p=document.getElementById("password").value;

  const account=JSON.parse(localStorage.getItem("user_"+n)||"null");

  if(account && account.password===p){
    user=n;
    save();
    dashboard();
  }else{
    document.getElementById("msg").textContent="Wrong username or password.";
  }
}

function logout(){
  user=null;
  saved.user=null;
  save();
  auth();
}

function chapterPage(cls,subject){
  shell(`

function chapterCard(cls,subject,ch,index){
  const key=cls+"|"+subject+"|"+ch;
  const dedicated=questions[key];

  return `
  <button
    class="tile"
    onclick="startQuiz(${cls},'${subject}','${esc(ch)}')">

    <span class="pill">CHAPTER ${index+1}</span>

    <h3>${esc(ch)}</h3>

    <span class="muted">
      ${
        dedicated
        ? dedicated.length+" practice questions"
        : "Mixed subject practice available"
      }
    </span>

  </button>`;
}

function filterChapters(cls,subject){
  const value=document.getElementById("search").value.toLowerCase();

  const list=chapters[cls][subject]
    .map((ch,i)=>({ch,i}))
    .filter(x=>x.ch.toLowerCase().includes(value));

  document.getElementById("chapterGrid").innerHTML=
    list.map(x=>chapterCard(cls,subject,x.ch,x.i)).join("")
    || `<div class="card muted">No chapter found.</div>`;
}

function startQuiz(cls,subject,ch){
  const key=cls+"|"+subject+"|"+ch;

  let pool=questions[key];

  if(!pool){
    pool=mixed[subject];
  }

  pool=shuffle(pool);

  quiz={
    title:"Class "+cls+" • "+subject+" • "+ch,
    questions:pool,
    current:0,
    score:0,
    answered:false,
    back:()=>chapterPage(cls,subject)
  };

  showQuestion();
}

function mixedPractice(){
  const subject=prompt(
    "Type Mathematics, Science or Social Science:",
    "Science"
  );

  if(!mixed[subject])return;

  const pool=shuffle(mixed[subject]);

  quiz={
    title:"Mixed "+subject+" Practice",
    questions:pool,
    current:0,
    score:0,
    answered:false,
    back:dashboard
  };

  showQuestion();
}

function showQuestion(){
  const q=quiz.questions[quiz.current];

  const options=shuffle(
    q.slice(1,5).map((text,index)=>({
      text:text,
      correct:index===q[5]
    }))
  );

  quiz.currentOptions=options;

  const percent=Math.round(
    quiz.current/quiz.questions.length*100
  );

  shell(`
  <div class="quiz">

    <div class="row between">
      <button class="btn" onclick="quiz.back()">← Exit</button>

      <span class="pill">
        Question ${quiz.current+1}/${quiz.questions.length}
      </span>
    </div>

    <div class="progress" style="margin:15px 0">
      <i style="width:${percent}%"></i>
    </div>

    <div class="card">

      <div class="muted">
        ${esc(quiz.title)}
      </div>

      <h2 class="question">
        ${esc(q[0])}
      </h2>

      <div id="options">
        ${options.map((o,i)=>`
          <button class="option" onclick="answer(${i})">
            ${String.fromCharCode(65+i)}. ${esc(o.text)}
          </button>
        `).join("")}
      </div>

      <div id="feedback"></div>

    </div>
  </div>
  `);
}

function answer(index){
  if(quiz.answered)return;

  quiz.answered=true;

  const option=quiz.currentOptions[index];

  if(option.correct){
    quiz.score++;
  }

  const buttons=[
    ...document.querySelectorAll(".option")
  ];

  buttons.forEach((btn,i)=>{
    if(quiz.currentOptions[i].correct){
      btn.classList.add("correct");
    }

    if(i===index && !option.correct){
      btn.classList.add("wrong");
    }
  });

  document.getElementById("feedback").innerHTML=`
    <div class="feedback ${option.correct?"good":"bad"}">
      ${option.correct?"🎉 EXCELLENT!":"❌ OOPS! IT’S WRONG"}
      <br>
      <span>
        ${
          option.correct
          ? "Correct answer!"
          : "Correct answer: "+
            esc(
              quiz.currentOptions.find(x=>x.correct).text
            )
        }
      </span>
    </div>

    <button
      class="btn primary"
      style="margin-top:12px"
      onclick="nextQuestion()">

      ${
        quiz.current===quiz.questions.length-1
        ? "See Result →"
        : "Next Question →"
      }

    </button>
  `;
}

function nextQuestion(){
  quiz.current++;

  if(quiz.current>=quiz.questions.length){
    result();
    return;
  }

  quiz.answered=false;
  showQuestion();
}

function result(){
  const total=quiz.questions.length;
  const percentage=Math.round(
    quiz.score/total*100
  );

  const s=stats();

  s.attempts++;
  s.questions+=total;
  s.correct+=quiz.score;
  s.best=Math.max(s.best,percentage);

  save();

  shell(`

}

function startMathGame(){
  let score=0;
  let time=30;

  function question(){
    const a=Math.floor(Math.random()*20)+1;
    const b=Math.floor(Math.random()*20)+1;

    const type=Math.floor(Math.random()*3);

    let op,answer;

    if(type===0){
      op="+";
      answer=a+b;
    }else if(type===1){
      op="−";
      answer=a-b;
    }else{
      op="×";
      answer=a*b;
    }

    const area=document.getElementById("gameArea");

    if(!area)return;

    area.innerHTML=`
      <h2>${a} ${op} ${b} = ?</h2>

      <input
        id="gameInput"
        type="number"
        autofocus
        style="padding:12px;border:1px solid #ccc;border-radius:10px">

      <p>
        Time:
        <b id="gameTime">${time}</b>s
        |
        Score:
        <b id="gameScore">${score}</b>
      </p>
    `;

    document
      .getElementById("gameInput")
      .addEventListener("keydown",function(e){

        if(e.key==="Enter"){

          if(Number(this.value)===answer){
            score++;
          }

          question();
        }

      });
  }

  question();

  const timer=setInterval(()=>{

    time--;

    const t=document.getElementById("gameTime");

    if(t)t.textContent=time;

    if(time<=0){

      clearInterval(timer);

      const area=document.getElementById("gameArea");

      if(area){
        area.innerHTML=`
          <h2>🏁 TIME UP!</h2>
          <div class="stat">${score}</div>
          <p>Correct Answers</p>
        `;
      }

    }

  },1000);
}
